<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九九チャレンジ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f4f7fb;
      color: #263238;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
    }

    .app {
      width: min(720px, 100%);
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(30, 50, 80, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(28px, 7vw, 44px);
    }

    .subtitle {
      text-align: center;
      margin: 0 0 24px;
      color: #607d8b;
    }

    .panel {
      background: #f8fafc;
      border: 2px solid #e3eaf2;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .dan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 14px;
      min-height: 48px;
      padding: 10px 14px;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    .dan-button,
    .mode-button {
      background: white;
      border: 2px solid #cfd8e3;
      font-weight: bold;
    }

    .dan-button.selected,
    .mode-button.selected {
      background: #dcecff;
      border-color: #3f8cff;
      color: #145dbf;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .start-button {
      width: 100%;
      background: #ffb300;
      color: #3d2c00;
      font-size: 22px;
      font-weight: bold;
      margin-top: 14px;
    }

    .hidden {
      display: none;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-bottom: 18px;
    }

    .status-item {
      background: #eef4fa;
      border-radius: 12px;
      padding: 10px 5px;
    }

    .status-label {
      display: block;
      font-size: 13px;
      color: #607d8b;
    }

    .status-value {
      display: block;
      font-size: 22px;
      font-weight: bold;
      margin-top: 2px;
    }

    .question {
      text-align: center;
      font-size: clamp(42px, 12vw, 72px);
      font-weight: bold;
      margin: 26px 0;
      letter-spacing: 3px;
    }

    .answer-area {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    #answerInput {
      width: 150px;
      min-height: 58px;
      border: 3px solid #b0bec5;
      border-radius: 14px;
      font-size: 30px;
      text-align: center;
    }

    #answerInput:focus {
      outline: none;
      border-color: #3f8cff;
    }

    .ok-button {
      min-width: 110px;
      background: #3f8cff;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .feedback {
      min-height: 42px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-top: 16px;
    }

    .best-score {
      text-align: center;
      background: #fff8e1;
      border: 2px solid #ffd54f;
      border-radius: 14px;
      padding: 12px;
      margin: 14px 0 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .key-button {
      background: #ffffff;
      border: 2px solid #cfd8e3;
      font-size: 28px;
      font-weight: bold;
      min-height: 64px;
    }

    .key-button.clear {
      background: #fff3e0;
      color: #bf360c;
    }

    .key-button.backspace {
      background: #eceff1;
      color: #37474f;
    }

    .correct {
      color: #16883f;
    }

    .wrong {
      color: #d84315;
    }

    .finish {
      text-align: center;
    }

    .finish h2 {
      font-size: 32px;
      margin-top: 4px;
    }

    .result-time {
      font-size: 36px;
      font-weight: bold;
      margin: 18px 0;
    }

    .result-detail {
      font-size: 20px;
      line-height: 1.8;
    }

    .retry-button {
      width: 100%;
      background: #3f8cff;
      color: white;
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
    }

    .back-button {
      width: 100%;
      background: #e9eef4;
      color: #37474f;
      font-weight: bold;
      margin-top: 10px;
    }

    @media (max-width: 520px) {
      .app {
        padding: 18px 14px;
      }

      .answer-area {
        flex-direction: column;
      }

      #answerInput,
      .ok-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>九九チャレンジ</h1>
    <p class="subtitle">段と出題順を選んで挑戦しよう！</p>

    <section id="settingScreen">
      <div class="panel">
        <h2>① 挑戦する段</h2>
        <div class="dan-grid" id="danButtons"></div>
      </div>

      <div class="panel">
        <h2>② 問題の順番</h2>
        <div class="mode-grid">
          <button class="mode-button selected" data-mode="asc">あがり</button>
          <button class="mode-button" data-mode="desc">くだり</button>
          <button class="mode-button" data-mode="random">バラバラ</button>
        </div>
      </div>

      <div class="best-score" id="settingBestScore">ベストタイム：まだ記録がありません</div>
      <button class="start-button" id="startButton">スタート！</button>
    </section>

    <section id="quizScreen" class="hidden">
      <div class="status">
        <div class="status-item">
          <span class="status-label">問題</span>
          <span class="status-value" id="progress">1 / 9</span>
        </div>
        <div class="status-item">
          <span class="status-label">正解</span>
          <span class="status-value" id="score">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">時間</span>
          <span class="status-value" id="timer">0.0秒</span>
        </div>
      </div>

      <div class="question" id="question">1 × 1 ＝</div>

      <div class="answer-area">
        <input
          id="answerInput"
          type="number"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          aria-label="答え"
        >
        <button class="ok-button" id="okButton">OK</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="keypad" id="keypad">
        <button class="key-button" data-key="1">1</button>
        <button class="key-button" data-key="2">2</button>
        <button class="key-button" data-key="3">3</button>
        <button class="key-button" data-key="4">4</button>
        <button class="key-button" data-key="5">5</button>
        <button class="key-button" data-key="6">6</button>
        <button class="key-button" data-key="7">7</button>
        <button class="key-button" data-key="8">8</button>
        <button class="key-button" data-key="9">9</button>
        <button class="key-button clear" data-key="clear">クリア</button>
        <button class="key-button" data-key="0">0</button>
        <button class="key-button backspace" data-key="backspace">⌫</button>
      </div>

      <button class="back-button" id="quitButton">やめて戻る</button>
    </section>

    <section id="finishScreen" class="hidden finish">
      <h2>おつかれさま！</h2>
      <div class="result-time" id="resultTime"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="best-score" id="finishBestScore"></div>
      <button class="retry-button hidden" id="reviewButton">まちがえた・5秒以上の問題に再挑戦</button>
      <button class="retry-button" id="retryButton">同じ条件でもう一度</button>
      <button class="back-button" id="changeButton">段や順番を変える</button>
    </section>
  </main>

  <script>
    const danButtons = document.getElementById("danButtons");
    const modeButtons = document.querySelectorAll(".mode-button");
    const settingScreen = document.getElementById("settingScreen");
    const quizScreen = document.getElementById("quizScreen");
    const finishScreen = document.getElementById("finishScreen");
    const startButton = document.getElementById("startButton");
    const okButton = document.getElementById("okButton");
    const answerInput = document.getElementById("answerInput");
    const question = document.getElementById("question");
    const progress = document.getElementById("progress");
    const score = document.getElementById("score");
    const timer = document.getElementById("timer");
    const feedback = document.getElementById("feedback");
    const reviewButton = document.getElementById("reviewButton");
    const retryButton = document.getElementById("retryButton");
    const changeButton = document.getElementById("changeButton");
    const quitButton = document.getElementById("quitButton");
    const resultTime = document.getElementById("resultTime");
    const resultDetail = document.getElementById("resultDetail");
    const settingBestScore = document.getElementById("settingBestScore");
    const finishBestScore = document.getElementById("finishBestScore");
    const keypad = document.getElementById("keypad");

    let selectedDan = 1;
    let selectedMode = "asc";
    let questions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let mistakeCount = 0;
    let startTime = 0;
    let timerId = null;
    let elapsedSeconds = 0;
    let acceptingAnswer = true;
    let questionStartTime = 0;
    let reviewQuestions = [];
    let isReviewMode = false;

    for (let dan = 1; dan <= 9; dan++) {
      const button = document.createElement("button");
      button.className = "dan-button";
      button.textContent = `${dan}の段`;
      button.dataset.dan = dan;

      if (dan === 1) {
        button.classList.add("selected");
      }

      button.addEventListener("click", () => {
        document.querySelectorAll(".dan-button").forEach(btn => {
          btn.classList.remove("selected");
        });
        button.classList.add("selected");
        selectedDan = Number(button.dataset.dan);
        updateBestScoreDisplay();
      });

      danButtons.appendChild(button);
    }

    modeButtons.forEach(button => {
      button.addEventListener("click", () => {
        modeButtons.forEach(btn => btn.classList.remove("selected"));
        button.classList.add("selected");
        selectedMode = button.dataset.mode;
        updateBestScoreDisplay();
      });
    });

    function getBestKey() {
      return `kukuBest_${selectedDan}_${selectedMode}`;
    }

    function getBestTime() {
      const saved = localStorage.getItem(getBestKey());
      return saved === null ? null : Number(saved);
    }

    function updateBestScoreDisplay() {
      const best = getBestTime();
      const label = `${selectedDan}の段・${getModeName(selectedMode)}`;

      if (best === null) {
        settingBestScore.textContent = `${label}のベストタイム：まだ記録がありません`;
      } else {
        settingBestScore.textContent = `${label}のベストタイム：${best.toFixed(1)}秒`;
      }
    }

    function saveBestTime(time) {
      const currentBest = getBestTime();

      if (currentBest === null || time < currentBest) {
        localStorage.setItem(getBestKey(), String(time));
        return true;
      }

      return false;
    }

    function createQuestions() {
      let multipliers = [1, 2, 3, 4, 5, 6, 7, 8, 9];

      if (selectedMode === "desc") {
        multipliers.reverse();
      }

      if (selectedMode === "random") {
        for (let i = multipliers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [multipliers[i], multipliers[j]] = [multipliers[j], multipliers[i]];
        }
      }

      return multipliers.map(multiplier => ({
        left: selectedDan,
        right: multiplier,
        answer: selectedDan * multiplier
      }));
    }

    function startQuiz() {
      isReviewMode = false;
      questions = createQuestions().map(item => ({
        ...item,
        hadMistake: false,
        responseTime: 0
      }));
      beginQuestionSet();
    }

    function startReview() {
      isReviewMode = true;
      questions = reviewQuestions.map(item => ({
        left: item.left,
        right: item.right,
        answer: item.answer,
        hadMistake: false,
        responseTime: 0
      }));
      beginQuestionSet();
    }

    function beginQuestionSet() {
      currentIndex = 0;
      correctCount = 0;
      mistakeCount = 0;
      acceptingAnswer = true;

      settingScreen.classList.add("hidden");
      finishScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      startTime = performance.now();
      clearInterval(timerId);
      timerId = setInterval(updateTimer, 100);

      showQuestion();
    }

    function showQuestion() {
      const current = questions[currentIndex];

      question.textContent = `${current.left} × ${current.right} ＝`;
      progress.textContent = `${currentIndex + 1} / ${questions.length}`;
      score.textContent = correctCount;
      answerInput.value = "";
      feedback.textContent = "";
      feedback.className = "feedback";
      acceptingAnswer = true;
      questionStartTime = performance.now();

      setTimeout(() => answerInput.focus(), 50);
    }

    function checkAnswer() {
      if (!acceptingAnswer) return;

      const inputValue = answerInput.value.trim();
      if (inputValue === "") {
        feedback.textContent = "答えを入れてね";
        feedback.className = "feedback wrong";
        answerInput.focus();
        return;
      }

      const userAnswer = Number(inputValue);
      const current = questions[currentIndex];

      if (userAnswer === current.answer) {
        acceptingAnswer = false;
        current.responseTime = (performance.now() - questionStartTime) / 1000;
        correctCount++;
        score.textContent = correctCount;
        feedback.textContent = "せいかい！";
        feedback.className = "feedback correct";

        setTimeout(() => {
          currentIndex++;

          if (currentIndex >= questions.length) {
            finishQuiz();
          } else {
            showQuestion();
          }
        }, 450);
      } else {
        mistakeCount++;
        current.hadMistake = true;
        feedback.textContent = "ちがうよ。もう一度！";
        feedback.className = "feedback wrong";
        answerInput.select();
      }
    }

    function updateTimer() {
      elapsedSeconds = (performance.now() - startTime) / 1000;
      timer.textContent = `${elapsedSeconds.toFixed(1)}秒`;
    }

    function finishQuiz() {
      clearInterval(timerId);
      elapsedSeconds = (performance.now() - startTime) / 1000;

      quizScreen.classList.add("hidden");
      finishScreen.classList.remove("hidden");

      reviewQuestions = questions.filter(item =>
        item.hadMistake || item.responseTime >= 5
      );

      resultTime.textContent = `${elapsedSeconds.toFixed(1)}秒`;

      const reviewText = reviewQuestions.length > 0
        ? `復習対象：${reviewQuestions.length}問`
        : "復習対象：なし";

      resultDetail.innerHTML =
        `${selectedDan}の段・${isReviewMode ? "復習" : getModeName(selectedMode)}<br>` +
        `正解：${correctCount}問 ／ 間違い：${mistakeCount}回<br>` +
        reviewText;

      if (!isReviewMode) {
        const isNewBest = saveBestTime(elapsedSeconds);
        const best = getBestTime();

        finishBestScore.textContent = isNewBest
          ? `新記録！ ベストタイム：${best.toFixed(1)}秒`
          : `ベストタイム：${best.toFixed(1)}秒`;

        updateBestScoreDisplay();
      } else {
        finishBestScore.textContent = "復習モードの時間はベストタイムには記録されません";
      }

      if (reviewQuestions.length > 0) {
        reviewButton.classList.remove("hidden");
        reviewButton.textContent =
          `まちがえた・5秒以上の${reviewQuestions.length}問に再挑戦`;
      } else {
        reviewButton.classList.add("hidden");
      }
    }

    function getModeName(mode) {
      if (mode === "asc") return "あがり";
      if (mode === "desc") return "くだり";
      return "バラバラ";
    }

    function returnToSettings() {
      clearInterval(timerId);
      settingScreen.classList.remove("hidden");
      quizScreen.classList.add("hidden");
      finishScreen.classList.add("hidden");
    }

    startButton.addEventListener("click", startQuiz);
    okButton.addEventListener("click", checkAnswer);
    reviewButton.addEventListener("click", startReview);
    retryButton.addEventListener("click", startQuiz);
    changeButton.addEventListener("click", returnToSettings);
    quitButton.addEventListener("click", returnToSettings);

    keypad.addEventListener("click", event => {
      const button = event.target.closest(".key-button");
      if (!button || !acceptingAnswer) return;

      const key = button.dataset.key;

      if (key === "clear") {
        answerInput.value = "";
      } else if (key === "backspace") {
        answerInput.value = answerInput.value.slice(0, -1);
      } else {
        if (answerInput.value.length < 3) {
          answerInput.value += key;
        }
      }

      answerInput.focus();
    });

    answerInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        checkAnswer();
      }
    });

    updateBestScoreDisplay();
  </script>
</body>
</html>
